openapi: 3.1.0
info:
  title: Hire me Pokédex API
  version: 1.0.0
  description: |
    Written FIRST, code second. The TypeScript SDK in src/sdk is generated from this file
    (npm run sdk:generate) + CI fails if the generated file and the spec drift apart.
    A contract test checks every path here has a route, and every route is in here.

    Auth: an HttpOnly session cookie (POST /api/auth/session) or a bearer token
    (same token, or a Keycloak token when OIDC is configured).
servers:
  - url: https://pokedex-nextjs14-lyart.vercel.app
  - url: http://localhost:3000
tags:
  - name: ops
  - name: auth
  - name: profile
  - name: pokedex
  - name: coach
  - name: events

paths:
  /api/health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: status + version for load balancers
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/flags:
    get:
      tags: [ops]
      operationId: getFlags
      summary: feature flags for the caller (sticky canary bucket cookie)
      responses:
        "200":
          description: flag values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flags" }

  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: your role + permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /api/auth/session:
    post:
      tags: [auth]
      operationId: openSession
      summary: access code -> session cookie. rate limited, JSON only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessCode]
              additionalProperties: false
              properties:
                accessCode: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "201":
          description: session opened, Set-Cookie hm_session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      operationId: closeSession
      responses:
        "200":
          description: cookie dropped
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /api/profile:
    get:
      tags: [profile]
      operationId: getProfile
      summary: my CV as json (profile:read)
      responses:
        "200":
          description: profile
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/contact:
    get:
      tags: [profile]
      operationId: getContact
      summary: phone + whatsapp (contact:read, recruiter or admin)
      responses:
        "200":
          description: contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/audit:
    get:
      tags: [ops]
      operationId: getAudit
      summary: recent access decisions (audit:read, admin only)
      responses:
        "200":
          description: newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/pokemon:
    get:
      tags: [pokedex]
      operationId: listPokemon
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 151, default: 151 }
      responses:
        "200":
          description: gen 1 list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PokemonSummary" }
        "502": { $ref: "#/components/responses/Error" }

  /api/pokemon/{name}:
    get:
      tags: [pokedex]
      operationId: getPokemon
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: full entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PokemonDetails" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/moves/{name}:
    get:
      tags: [pokedex]
      operationId: getMove
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: move
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Move" }
        "404": { $ref: "#/components/responses/Error" }

  /api/route:
    get:
      tags: [pokedex]
      operationId: planGymTour
      summary: shortest round trip through the kanto gyms
      parameters:
        - name: from
          in: query
          schema: { type: string, default: pallet }
      responses:
        "200":
          description: tour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tour" }
        "404": { $ref: "#/components/responses/Error" }

  /api/coach:
    post:
      tags: [coach]
      operationId: coachTeam
      summary: AI coach. streams server-sent events (delta, fallback, diagnosis, error, done)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team]
              properties:
                team:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items: { $ref: "#/components/schemas/TeamMember" }
                log:
                  type: array
                  maxItems: 400
                  items: { type: object, additionalProperties: true }
      responses:
        "200":
          description: |
            text/event-stream. the `diagnosis` event carries a Diagnosis + the model that answered
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/events/hire:
    post:
      tags: [events]
      operationId: hireClicked
      summary: the HIRE button. fans out to slack + a signed webhook
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "429": { $ref: "#/components/responses/Error" }

components:
  parameters:
    Slug:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]{1,40}$" }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: your role doesn't have the permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Forbidden" }

  schemas:
    Role:
      type: string
      enum: [visitor, recruiter, admin]
    Permission:
      type: string
      enum: [profile:read, pokedex:read, coach:use, contact:read, audit:read]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        requestId: { type: string }
    Forbidden:
      type: object
      required: [error, need, youAre]
      properties:
        error: { type: string, const: forbidden }
        need: { $ref: "#/components/schemas/Permission" }
        youAre: { $ref: "#/components/schemas/Role" }
    Health:
      type: object
      required: [status, version, uptimeS]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
        uptimeS: { type: integer }
    Flags:
      type: object
      required: [smart-ai, shiny-sprites]
      properties:
        smart-ai: { type: boolean }
        shiny-sprites: { type: boolean }
    Me:
      type: object
      required: [role, permissions, expiresAt]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        expiresAt: { type: [integer, "null"] }
    Contact:
      type: object
      required: [email, phone, whatsapp]
      properties:
        email: { type: string }
        phone: { type: [string, "null"] }
        whatsapp: { type: [string, "null"] }
    AuditEntry:
      type: object
      required: [at, role, action, allowed]
      properties:
        at: { type: integer }
        role: { $ref: "#/components/schemas/Role" }
        action: { type: string }
        allowed: { type: boolean }
    PokemonSummary:
      type: object
      required: [id, name, sprite]
      properties:
        id: { type: integer }
        name: { type: string }
        sprite: { type: string }
    BaseStats:
      type: object
      required: [hp, attack, defense, specialAttack, specialDefense, speed]
      properties:
        hp: { type: integer }
        attack: { type: integer }
        defense: { type: integer }
        specialAttack: { type: integer }
        specialDefense: { type: integer }
        speed: { type: integer }
    Move:
      type: object
      required: [name, type, power]
      properties:
        name: { type: string }
        type: { type: string }
        power: { type: [integer, "null"] }
    PokemonDetails:
      allOf:
        - $ref: "#/components/schemas/PokemonSummary"
        - type: object
          required: [types, heightM, weightKg, abilities, stats, moveNames, description, evolutions]
          properties:
            types: { type: array, items: { type: string } }
            heightM: { type: number }
            weightKg: { type: number }
            abilities:
              type: array
              items:
                type: object
                required: [name, hidden]
                properties:
                  name: { type: string }
                  hidden: { type: boolean }
            stats: { $ref: "#/components/schemas/BaseStats" }
            moveNames: { type: array, items: { type: string } }
            description: { type: string }
            evolutions:
              type: array
              items: { $ref: "#/components/schemas/PokemonSummary" }
    TeamMember:
      type: object
      required: [id, name, sprite, types, stats, moves]
      properties:
        id: { type: integer }
        name: { type: string }
        sprite: { type: string }
        types: { type: array, items: { type: string } }
        stats: { $ref: "#/components/schemas/BaseStats" }
        moves:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Move" }
    Stop:
      type: object
      required: [id, name, x, y]
      properties:
        id: { type: string }
        name: { type: string }
        x: { type: number }
        y: { type: number }
    Tour:
      type: object
      required: [order, distance]
      properties:
        order:
          type: array
          items: { $ref: "#/components/schemas/Stop" }
        distance: { type: number }
